- id: '01'
  context: Access Hollywood tape, 2005.
  text: >-
    They called it locker-room talk. Very unfair to locker rooms. Most men go in there after doing something athletic. I went straight to the sexual-harassment portion of the workout.
- id: '02'
  context: Puerto Rico paper-towel visit, 2017.
  text: >-
    Puerto Rico, I threw the paper towels. Beautiful throw. They wanted infrastructure. You can’t throw a fucking power grid. Nobody appreciates the practical limitations.
- id: '03'
  context: Family separations, 2018.
  text: >-
    Family separation, terrible. Then they started separating my name from the policy. Much better. Same policy, but suddenly I could sleep. You have to take care of families. Mine, specifically.
- id: '04'
  context: Disinfectant remarks, April 2020.
  text: >-
    I asked about disinfectant inside the body. Asked. Suddenly everybody’s a doctor. The bottle says it kills everything, but apparently I’m the asshole for asking about the remaining market.
- id: '05'
  context: St. John’s Bible photo, June 2020.
  text: >-
    I held up the Bible. They wanted me to open it. Then what? Follow it? These people see one photograph and suddenly they think they can renegotiate the whole fucking arrangement.
- id: '06'
  context: Hurricane Dorian’s altered forecast map, 2019.
  text: >-
    The hurricane map, beautiful map. One little line and the weather people lose their shit. They can redraw the forecast every six hours. I make one correction and suddenly geography needs a lawyer.
- id: '07'
  context: Comments about John McCain’s capture, 2015.
  text: >-
    McCain survived captivity. People say that takes courage. Fine. Try telling a room full of veterans you’re unimpressed. I did that without even checking where the fucking exits were.
- id: '08'
  context: The abandoned G7-at-Doral plan, 2019.
  text: >-
    They wouldn’t let me host the G7 at Doral. Seven world leaders, all that money, and I’m supposed to stand there with my dick in my hand while somebody else gets the room bookings?
- id: '09'
  context: Downplaying COVID in the Woodward recordings, 2020.
  text: >-
    I didn’t want people panicking. So I told Bob Woodward how bad it was. Privately. Into a recorder. The man writes books about presidential disasters. I thought, finally, somebody who understands my market.
- id: '10'
  context: The Fifth Avenue shooting boast, 2016.
  text: >-
    The Fifth Avenue thing, everybody focused on the shooting. Nobody discussed customer retention. You say one little murder and suddenly the business schools get fucking squeamish.
- id: '11'
  context: Death-penalty newspaper ads after the Central Park attack, 1989.
  text: >-
    The Central Park Five were exonerated. Fine. But I paid for a full-page ad. Full page. You want me to admit I was wrong at those fucking advertising rates?
- id: '12'
  context: The Kovaleski controversy and demand for an apology, 2015.
  text: >-
    They said I mocked the reporter. I demanded an apology. From him. That’s where amateurs fuck up. They spend the whole scandal defending themselves. I send an invoice.
